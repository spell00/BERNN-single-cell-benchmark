name: Reproduce frozen paper figures
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Validate grouped CV3 manifest partitions
        run: make cv3-check
      - name: Run CV3 pilot score audit
        run: make cv3-pilot-audit
      - name: Validate saved results and rerun figures
        run: make all
      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: generated-figures
          path: figures/
